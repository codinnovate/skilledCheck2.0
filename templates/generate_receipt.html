{% extends 'base.html' %} {% load crispy_forms_tags %} {% block content %}
<div class="flex flex-col items-center justify-center m-5">
  <h1 class="text-xl font-bold text-center">Generate Receipt</h1>

  <form method="post" class="font-semibold space-y-2">
    {% csrf_token %} {{ form|crispy }}

    <div
      type="submit"
      class="ring-2 my-2 ring-blue-500 text-center rounded-md text-black py-2 px-5 w-72 hover:bg-blue-500 hover:text-white font-semibold mx-3"
    >
      Generate Receipt
    </div>
  </form>
</div>
{% endblock %}
