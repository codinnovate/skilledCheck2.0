{% extends 'base.html' %}
{% load static %}
{% block content %}

<section class="wrapper image-wrapper bg-image bg-overlay bg-overlay-light-600 text-white" data-image-src="{% static 'assets/img/photos/bg18.png' %}">
      <div class="container pt-17 pb-20 pt-md-19 pb-md-21 text-center">
        <div class="row">
          <div class="col-lg-8 mx-auto">
            <h1 class="display-1 mb-3">Login</h1>
          </div>
          <!-- /column -->
        </div>
        <!-- /.row -->
      </div>
      <!-- /.container -->
    </section>
    <!-- /section -->
    <section class="wrapper bg-light">
      <div class="container pb-14 pb-md-16">
        <div class="row">
          <div class="col-lg-7 col-xl-6 col-xxl-5 mx-auto mt-n20">
            
            <div class="card">
              <div class="card-body p-11 text-center">
                <p class="lead mb-6 text-center">Enter Otp Sent to Your Mobile Number.</p>
                
                <form class="text-start mb-3 rounded-pill" method="POST">
                  {% csrf_token %}
                  <div class="form-floating password-field mb-4">
                    <input type="text"  name='otp' class="form-control" placeholder="OTP" id="loginPassword">
                    <label for="loginPassword">OTP</label>
                  </div> 
                  <button class="btn btn-primary btn-login w-100 mb-2 mt-2" type="Submit"> <a class="text-black hover:text-black">Login</a>
                  </button>
                </form>
                <!-- /form -->
                {% for message in messages %}
                <p class='mb-0' style="text-align:center; color:red">{{message}}</p>
                {% endfor %}
              </div>
              <!--/.card-body -->
            </div>
            <!--/.card -->
          </div>
          <!-- /column -->
        </div>
        <!-- /.row -->
      </div>
      <!-- /.container -->
    </section>
    <!-- /section -->
  </div>
  


  {% endblock content %}
