{% extends 'base.html' %}
{% load static %}
{% block content %}

<div class="choosebanner">
      <div class="container pt-17 pb-20 pt-md-19 pb-md-21 text-center">
        <div class="row">
          <div class="col-lg-8 mx-auto">
            <h1 class="display-1 mb-3">Login</h1>
          </div>
          <!-- /column -->
        </div>
        <!-- /.row -->
      </div>
      <!-- /.container -->
    </section>
    <!-- /section -->
    <div class="wrapper bg-light">
      <div class="container pb-14 pb-md-16">
        <div class="row">
          <div class="col-lg-7 col-xl-6 col-xxl-5 mx-auto mt-n20">
            
            <div class="card">
              <div class="card-body p-11 text-center">
                <p class="lead mb-6 text-center">Enter Your Phone Number .</p>
               
                <form class="text-start mb-3 rounded-pill" method="POST">
                  {% csrf_token %}

                   <div class="form-floating mb-4">
                    <input type="text"  name='phone_number' class="form-control" placeholder="Phone Number" id="text" oninput="myFunction()" >
                    <label for="text">Phone Number</label>
                  </div>
                
                  <button id="myButton" class=" w-100 none mb-2 mt-2" type="Submit">
                     <a class="text-black hover:text-black">Login</a>
                  </button>
                </form>
                <!-- /form -->
                <p class="">Don't have an account? <a href="{% url 'register' %}" class="hover">Sign up</a></p>
                 {% for message in messages %}
                <p class='mb-0' style="text-align:center; color:red">{{message}}</p>
                {% endfor %}
              </div>
              
              <!--/.card-body -->
            </div>
            <!--/.card -->
          </div>
          <!-- /column -->
        </div>
        <!-- /.row -->
      </div>
      <!-- /.container -->
    </div>
    <!-- /section -->
  </div>
  


  {% endblock content %}
